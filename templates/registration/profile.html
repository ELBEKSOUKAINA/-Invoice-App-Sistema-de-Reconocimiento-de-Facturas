<!DOCTYPE html>
<html>
<head>
    <title>Mi Perfil - InvoiceApp</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 50px auto; padding: 20px; }
        .profile-info { background: #f5f5f5; padding: 20px; border-radius: 5px; }
        .actions { margin-top: 20px; }
        .btn { display: inline-block; padding: 10px 15px; margin-right: 10px; text-decoration: none; border-radius: 4px; }
        .btn-primary { background: #2196F3; color: white; }
        .btn-danger { background: #f44336; color: white; }
    </style>
</head>
<body>
    <h2>Mi Perfil</h2>
    
    <div class="profile-info">
        <p><strong>Usuario:</strong> {{ user.username }}</p>
        <p><strong>Email:</strong> {{ user.email|default:"No especificado" }}</p>
        <p><strong>Fecha de registro:</strong> {{ user.date_joined|date:"d/m/Y H:i" }}</p>
        <p><strong>Último acceso:</strong> {{ user.last_login|date:"d/m/Y H:i" }}</p>
    </div>
    
    <div class="actions">
        <a href="{% url 'home' %}" class="btn btn-primary">Volver al inicio</a>
        <a href="{% url 'logout' %}" class="btn btn-danger">Cerrar Sesión</a>
    </div>
</body>
</html>
